services:
   db:
      image: postgres:17
      container_name: excess_food_postgres
      restart: unless-stopped
      
      environment:
        POSTGRES_DB: food_platform_db
        POSTGRES_USER: food_user
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      ports:
        - "127.0.0.1:5432:5432"

      volumes:
        - postgres_data:/var/lib/postgresql/data

      healthcheck:
        test:
          - CMD-SHELL
          - pg_isready -U food_user -d food_platform_db
        interval: 5s
        timeout: 5s
        retries: 10

volumes:
   postgres_data:

          